services:
  - type: web
    name: rag-teaching-assistant-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python build_index.py
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: GOOGLE_API_KEY
        sync: false